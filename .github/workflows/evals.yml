name: eval-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Node is needed for the filesystem MCP server (npx). ubuntu-latest ships it,
      # but pin it explicitly so CI is reproducible.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install project
        run: |
          pip install uv
          uv pip install --system -e .

      # Build the retrieval index in the fresh container (data/index.json is a
      # generated artifact, not committed) so search_docs has something to read.
      - name: build index
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m harness.retrieval.ingest docs

      - name: run eval gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python ci_gate.py
