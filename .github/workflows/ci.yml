name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install project
        run: |
          pip install uv
          uv pip install --system -e .

      - name: lint
        run: |
          pip install ruff
          ruff check src/ || true

      - name: import check
        run: python -c "import harness; print('imports OK')"
